name: Android APK

# Compila la app nativa de Android y publica el APK como artefacto descargable.
# No necesita Android Studio en ningún servidor: GitHub lo compila en la nube.
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK (artefacto)
        uses: actions/upload-artifact@v4
        with:
          name: CineTV-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Preparar APK para release
        run: cp android/app/build/outputs/apk/debug/app-debug.apk cinetv.apk

      # Publica el APK en un release fijo "app-latest" -> URL pública estable:
      # https://github.com/<owner>/<repo>/releases/latest/download/cinetv.apk
      - name: Publicar release (descarga pública)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: CineTV App (última versión)
          body: APK de CineTV para Android. Instalá desde orígenes desconocidos.
          files: cinetv.apk
          make_latest: true
